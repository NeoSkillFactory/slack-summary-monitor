# Example configuration for slack-summary-monitor
# Copy this file to scripts/config.yaml and edit as needed.

slack:
  channels:
    - general
    - engineering
    - product
    - devops

  keywords:
    - bug
    - deploy
    - incident
    - release
    - outage
    - blocker
    - hotfix
    - rollback

  lookback_days: 7

report:
  output_dir: ./output
  title_prefix: "Weekly Slack Summary"
  max_examples_per_keyword: 5
